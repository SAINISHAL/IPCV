# Classroom Face Recognition System Configuration
system:
  project_name: "Classroom-Eigenfaces-Recognition"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  student_archives_dir: "../Data"
  extracted_faces_dir: "data/extracted_faces"
  processed_faces_dir: "data/processed_faces"
  label_file: "data/label.txt"
  yolo_weights: "models/yolo/best.pt"
  yolo_fallback_weights: "models/yolo/yolov8n.pt"
  pca_model_dir: "models/eigenfaces"
  classifier_model_dir: "models/classifiers"
  reports_dir: "reports"
  figures_dir: "reports/figures"

detection:
  engine: "ensemble"  # options: "ensemble", "yolo_face", "yunet"
  confidence_threshold: 0.35
  nms_threshold: 0.40
  min_face_size: [15, 15]
  max_face_aspect_ratio: 2.5
  expand_box_ratio: 0.12  # padding around face crop
  align_faces: true

preprocessing:
  target_size: [100, 100]  # width, height
  grayscale: true
  normalize_intensity: true
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  filter_blurry: true
  blur_laplacian_threshold: 20.0

eigenfaces:
  dual_pca: true
  default_k: 25
  candidate_k_values: [5, 10, 15, 20, 25, 30, 40, 50]
  save_eigenfaces_visualization: true
  num_visualize_eigenfaces: 10

recognition:
  classifier_type: "svm"  # options: "svm", "knn", "euclidean"
  svm:
    kernel: "rbf"
    C: 10.0
    gamma: "scale"
    probability: true
  knn:
    n_neighbors: 3
    metric: "euclidean"
    weights: "distance"
  unknown_rejection:
    euclidean_threshold_std_factor: 1.5
    svm_confidence_threshold: 0.625  # keep the cluster model cutoff stable across enrollment updates
    knn_distance_threshold_factor: 1.3

webcam:
  device_id: 0
  frame_width: 1280
  frame_height: 720
  target_fps: 30
  smoothing_window_size: 5
  box_color_known: [0, 255, 0]      # BGR: Green
  box_color_unknown: [0, 0, 255]    # BGR: Red
  font_scale: 0.6
  font_thickness: 2

